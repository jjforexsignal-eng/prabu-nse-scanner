name: GANN Scanner Test

on:
  workflow_dispatch:

jobs:
  gann-scan:
    name: Run GANN Scanner
    runs-on: ubuntu-latest

    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:

      # ------------------------------------------------------
      # 1. Download repository
      # ------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # 2. Install Python
      # ------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      # ------------------------------------------------------
      # 3. Install dependencies
      # ------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ------------------------------------------------------
      # 4. Check Python
      # ------------------------------------------------------
      - name: Check Python
        run: |
          python --version
          pip --version

      # ------------------------------------------------------
      # 5. Check scanner file
      # ------------------------------------------------------
      - name: Check scanner
        run: |
          ls -lah
          echo "--------------------------------"
          ls -lah scanners
          echo "--------------------------------"
          python -m py_compile scanners/gann_scanner.py

      # ------------------------------------------------------
      # 6. Run GANN scanner
      # ------------------------------------------------------
      - name: Run GANN scanner
        run: |
          python scanners/gann_scanner.py
