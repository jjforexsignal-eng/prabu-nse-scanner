name: Vedic Gann Price Action Scanner

on:
  workflow_dispatch:

  schedule:
    # 09:15 to 09:55
    - cron: "15,20,25,30,35,40,45,50,55 9 * * 1-5"
      timezone: "Asia/Kolkata"

    # 10:00 to 14:55
    - cron: "*/5 10-14 * * 1-5"
      timezone: "Asia/Kolkata"

    # 15:00 to 15:25
    - cron: "0,5,10,15,20,25 15 * * 1-5"
      timezone: "Asia/Kolkata"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance pytz pyswisseph requests

      - name: Run Vedic Scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scanners/vedic_price_action.py
